AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC with 2 Public and 2 Private subnets across 2 AZs, plus Client VPN endpoint'

Parameters:
  VPCCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC
  ServerCertificateArn:
    Type: String
    Description: ACM ARN of the server certificate (imported by setup-certs.sh, see acm-arns.env)
  ClientRootCertificateChainArn:
    Type: String
    Description: ACM ARN of the client root certificate chain (imported by setup-certs.sh, see acm-arns.env)
  HostedZoneName:
    Type: String
    Description: Name of the hosted zone (e.g. zumiki.com)


###### VPC and Subnets ######

Resources:
  # VPC and Internet Gateway
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: MyVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-AZ1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public-Subnet-AZ2

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      CidrBlock: 10.0.3.0/24
      Tags:
        - Key: Name
          Value: Private-Subnet-AZ1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      CidrBlock: 10.0.4.0/24
      Tags:
        - Key: Name
          Value: Private-Subnet-AZ2

  # Routing for Public Subnets
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Security Groups
  PublicSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS and SSH to public instances
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  PrivateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow internal traffic only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: -1
          SourceSecurityGroupId: !Ref PublicSecurityGroup

  ###### Route 53 Hosted Zone ######
  rDNS:
    Type: AWS::Route53::HostedZone
    Properties:
      HostedZoneConfig:
        Comment: 'VPN'
      Name: !Ref HostedZoneName

  ###### Client VPN ######
  rVPNclientEndpoint:
    Type: AWS::EC2::ClientVpnEndpoint
    Properties:
      AuthenticationOptions:
        - Type: "certificate-authentication"
          MutualAuthentication:
            ClientRootCertificateChainArn: !Ref ClientRootCertificateChainArn
      ClientCidrBlock: "192.168.4.0/22"
      ClientConnectOptions:
        Enabled: false
      ClientLoginBannerOptions:
        Enabled: false
      ConnectionLogOptions:
        Enabled: false
      Description: VPN Sao Paulo
      SecurityGroupIds:
        - !Ref PublicSecurityGroup
      ServerCertificateArn: !Ref ServerCertificateArn
      SessionTimeoutHours: 24
      SplitTunnel: false
      VpcId: !Ref VPC
      TransportProtocol: udp
      VpnPort: 1194
      TagSpecifications:
        - ResourceType: "client-vpn-endpoint"
          Tags:
            - Key: "Name"
              Value: "VPN Endpoint"

  rVPNtargetNetwork:
    Type: AWS::EC2::ClientVpnTargetNetworkAssociation
    DependsOn: VPCGatewayAttachment
    Properties:
      ClientVpnEndpointId: !Ref rVPNclientEndpoint
      SubnetId: !Ref PublicSubnet1

  rRoute1:
    Type: AWS::EC2::ClientVpnRoute
    DependsOn: rVPNtargetNetwork
    Properties:
      ClientVpnEndpointId: !Ref rVPNclientEndpoint
      TargetVpcSubnetId: !Ref PublicSubnet1
      DestinationCidrBlock: "0.0.0.0/0"
      Description: "Internet"

  rRoute2:
    Type: AWS::EC2::ClientVpnRoute
    DependsOn: rVPNtargetNetwork
    Properties:
      ClientVpnEndpointId: !Ref rVPNclientEndpoint
      TargetVpcSubnetId: "local"
      DestinationCidrBlock: "192.168.4.0/22"
      Description: "Local"

  rAuthRule1:
    Type: AWS::EC2::ClientVpnAuthorizationRule
    Properties:
      AuthorizeAllGroups: true
      ClientVpnEndpointId: !Ref rVPNclientEndpoint
      Description: Internet
      TargetNetworkCidr: "0.0.0.0/0"

  rAuthRule2:
    Type: AWS::EC2::ClientVpnAuthorizationRule
    Properties:
      AuthorizeAllGroups: true
      ClientVpnEndpointId: !Ref rVPNclientEndpoint
      Description: vpc
      TargetNetworkCidr: !Ref VPCCidr

  myDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref rDNS
      Name: vpn.zumiki.com
      ResourceRecords:
        - !Sub "vpn.${rVPNclientEndpoint}.prod.clientvpn.sa-east-1.amazonaws.com"
      TTL: 900
      Type: CNAME

Outputs:
  VpcId:
    Value: !Ref VPC
  HostedZoneID:
    Description: HostedZone ID
    Value: !Ref rDNS
  PublicSubnets:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PrivateSubnets:
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
